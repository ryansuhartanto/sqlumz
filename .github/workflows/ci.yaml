on:
  push:

env:
  PACKAGE: sqlumz-*.tgz

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bunx vp check
      - run: bun run test
      - run: bun run pack
      - uses: actions/upload-artifact@v7
        id: artifact
        with:
          path: ${{ env.PACKAGE }}
          archive: false

  cd:
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          skip-decompress: true
      - uses: actions/attest@v4
        with:
          subject-path: ${{ env.PACKAGE }}

      - run: npm install -g npm@latest
      - run: npx pkg-pr-new publish ${{ env.PACKAGE }}
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish ${{ env.PACKAGE }}
