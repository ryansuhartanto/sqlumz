on:
  push:

env:
  PACKAGE: sqlumz-*.tgz

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/aube-action@v1
        with:
          node-version: auto
          run-install: true
      - run: aubx vp check
      - run: aubx vp test
      - run: aube pack
      - uses: actions/upload-artifact@v7
        id: artifact
        with:
          path: ${{ env.PACKAGE }}
          archive: false

  cd:
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          skip-decompress: true
      - uses: actions/attest@v4
        with:
          subject-path: ${{ env.PACKAGE }}

      - run: npx pkg-pr-new publish ${{ env.PACKAGE }}
      - if: startsWith(github.ref, 'refs/tags/v')
        run: >
          env "NPM_CONFIG_//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
          npm publish ${{ env.PACKAGE }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
